[project]
name = "roman-epsf"
version = "0.1.0"
description = "ePSF model construction for Roman WFI detectors"
authors = [{name = "Jorge Martinez-Palomera", email = "jorgemarpa@ug.uchile.cl"}]
readme = "docs/README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<2.5",
    "astropy>5,<8",
    "photutils>=2.0",
    "scipy>=1.10",
    "pandas>1.5,<3.0",
    "roman-cuts[com]",
]

[project.optional-dependencies]
dq = [
    "roman-datamodels>=1.0.0,<2.0",
]
all = [
    "roman-datamodels>=1.0.0,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9.0",
    "ruff>=0.11.0,<0.12",
    "mypy>=1.15.0,<2.0",
    "mkdocs>=1.6.0,<2.0",
    "mkdocs-material>=9.5.0,<10.0",
    "mkdocstrings[python]>=0.29.0,<0.30",
    "mkdocs-jupyter>=0.25.1,<0.26",
    "pymdown-extensions<10.15",
]

[tool.uv.sources]
roman-cuts = { git = "https://github.com/jorgemarpa/roman-cuts.git"}
astroquery = { git = "https://github.com/astropy/astroquery.git", rev = "refs/pull/3593/head" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roman_epsf"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
ignore_missing_imports = true
disable_error_code = ["import-untyped", "index", "operator", "arg-type", "union-attr", "assignment"]
